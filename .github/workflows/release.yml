name: Release

# Stages the package on npm with trusted publishing (OIDC): no npm token is stored anywhere. The trusted
# publisher on npmjs.com (Trusted Publisher → GitHub Actions, workflow file: release.yml) is allowed to
# stage only, so a release goes public after a maintainer runs `npm stage approve` with 2FA.
#
# To release: bump "version" in package.json and VERSION in src/index.ts, add a CHANGELOG section,
# commit, then push a matching tag:  git tag -a v0.1.2 -m "thai-rtgs 0.1.2" && git push origin v0.1.2

on:
  push:
    tags: ['v*']
  # A manual run is always a dry run: it runs the checks and packs, but publishes nothing.
  # Only a pushed tag publishes, so npm versions always have a matching tag.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: CHANGELOG has a section for this version
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## ${version} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1; }

      - run: npm ci

      # Typecheck, tests and build (the same checks npm publish would run).
      - run: npm run prepublishOnly

      - name: Pack (dry run)
        if: env.DRY_RUN == 'true'
        run: npm pack --dry-run

      # The trusted publisher may only stage: the version reaches npm after a maintainer approves it
      # with 2FA (npm stage approve). Staging needs no token.
      - name: Stage on npm
        if: env.DRY_RUN != 'true'
        run: npm stage publish

      - name: How to approve
        if: env.DRY_RUN != 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          {
            echo "## thai-rtgs ${version} is staged on npm"
            echo
            echo "It is not public yet. On your machine (logged in to npm):"
            echo
            echo '```bash'
            echo "npm stage list thai-rtgs"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Then publish the draft GitHub Release for v${version}."
          } >> "$GITHUB_STEP_SUMMARY"

      # A draft, because the version is not on npm until it is approved.
      - name: Draft GitHub Release from the CHANGELOG
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\n**npm:** [`thai-rtgs@%s`](https://www.npmjs.com/package/thai-rtgs/v/%s)\n' "$version" "$version" >> notes.md
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists"
          else
            gh release create "v${version}" --draft --title "thai-rtgs ${version}" --notes-file notes.md --verify-tag
          fi
